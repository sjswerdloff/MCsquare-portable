# GitHub Actions CI for MCsquare-portable
# Builds and tests on Linux (gcc) and macOS ARM64 (clang)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & Test (Linux gcc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build MCsquare_portable
        run: make MCsquare_portable

      - name: Verify binary
        run: |
          ls -la MCsquare_portable
          file MCsquare_portable

      - name: Smoke test (1000 primaries)
        run: |
          mkdir -p smoke_test_output
          ./MCsquare_portable Sample_input_data/smoke_test_config.txt

      - name: Verify output
        run: |
          ls -la smoke_test_output/
          test -f smoke_test_output/Dose.mhd
          echo "Smoke test passed - Dose.mhd created"

  build-macos-arm64:
    name: Build & Test (macOS ARM64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install libomp
        run: brew install libomp

      - name: Build MCsquare_arm64
        run: make MCsquare_arm64

      - name: Verify binary
        run: |
          ls -la MCsquare_arm64
          file MCsquare_arm64

      - name: Smoke test (1000 primaries)
        run: |
          mkdir -p smoke_test_output
          ./MCsquare_arm64 Sample_input_data/smoke_test_config.txt

      - name: Verify output
        run: |
          ls -la smoke_test_output/
          test -f smoke_test_output/Dose.mhd
          echo "Smoke test passed - Dose.mhd created"
