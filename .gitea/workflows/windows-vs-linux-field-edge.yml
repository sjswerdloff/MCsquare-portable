# Does the Windows build give the same dose as the Linux build? Portable MCsquare at this commit,
# built with GCC on each (Linux: make MCsquare_portable; Windows: make MCsquare_win_portable in
# MSYS2 UCRT64), runs the field-edge case (200 MeV, 15 x 15 cm, 300 mm water cube, 3 threads, two seeds).
# Each job prints its own profile table (field_edge_profile.py: CAX dose and lateral % of CAX, per seed
# and mean); the two tables are compared by hand. Dose files are not moved between jobs because artifact
# upload on this Gitea is refused (it advertises an upload URL on port 80). Linux runs are labelled
# "before" and Windows "after" only to keep their output directories apart.

name: Windows vs Linux field-edge (portable)

on:
  workflow_dispatch:
  # Research run, not CI: it holds both Windows boxes for over an hour, so not on pull requests.
  # Re-runs on a branch push that changes anything the comparison depends on.
  push:
    branches: ['connor/field-edge-*', 'connor/windows-*']
    paths:
      - .gitea/workflows/windows-vs-linux-field-edge.yml
      - .gitea/scripts/ensure-msys2.ps1
      - validation/field_edge_*.py
      - src/**
      - Makefile
      - BDL/**
      - Materials/**
      - Scanners/**

env:
  PRIMARIES: "3e7"

jobs:
  linux:
    name: Linux portable (gcc)
    runs-on: linux
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run
        run: |
          lscpu | grep 'Model name'; gcc --version | head -1
          make MCsquare_portable
          uv run --no-project --with numpy python validation/field_edge_make_cases.py 200 150
          for s in A B; do
            seed=12345; [ $s = B ] && seed=67890
            printf '%s\n' "Num_Threads 3" "Num_Primaries $PRIMARIES" "RNG_Seed $seed" "CT_File cube.mhd" \
              "HU_Density_Conversion_File Scanners/default/HU_Density_Conversion.txt" \
              "HU_Material_Conversion_File Scanners/default/HU_Material_Conversion.txt" \
              "BDL_Machine_Parameter_File BDL/BDL_default_DN_RangeShifter.txt" \
              "BDL_Plan_File E200_S150.txt" "Output_Directory out_E200_S150_before_$s" "Dose_MHD_Output True" > cfg_$s.txt
            mkdir -p out_E200_S150_before_$s
            start=$(date +%s); ./MCsquare_portable cfg_$s.txt > log_$s.txt 2>&1 || { tail -20 log_$s.txt; exit 1; }
            echo "RUN linux_$s seed=$seed wall_s=$(( $(date +%s) - start ))"; test -s out_E200_S150_before_$s/Dose.raw
          done
          echo "=== LINUX profile"
          uv run --no-project --with numpy python validation/field_edge_profile.py "$PWD" E200_S150 before

  windows:
    name: Windows portable (MinGW-w64 gcc)
    runs-on: windows
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: MSYS2 + UCRT64 GCC (verified, once per box)
        shell: powershell
        run: |
          & .\.gitea\scripts\ensure-msys2.ps1
      - name: Build and run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $m = 'C:\mcsq-win\msys64-20260927'
          $env:MSYSTEM = 'UCRT64'; $env:CHERE_INVOKING = '1'
          & "$m\usr\bin\bash.exe" -lc 'make MCsquare_win_portable' 2>&1 | Select-Object -Last 3
          if (-not (Test-Path MCsquare_win_portable.exe)) { throw "build failed" }
          $env:PATH = "$m\ucrt64\bin;$env:PATH"
          # Python + numpy from MSYS2's own packages (pacman verifies their signatures) into the verified
          # tree ensure-msys2.ps1 manages; no separate download. --needed makes it a no-op once installed.
          & "$m\usr\bin\bash.exe" -lc 'pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-numpy' 2>&1 | Select-Object -Last 3
          if ($LASTEXITCODE) { throw "pacman install of python/numpy failed ($LASTEXITCODE)" }  # before any check an older install could satisfy
          $py = "$m\ucrt64\bin\python.exe"
          if (-not (Test-Path $py)) { throw "MSYS2 python not installed" }
          & $py -c "import numpy, sys; print('python', sys.version.split()[0], 'numpy', numpy.__version__)"
          if ($LASTEXITCODE) { throw "numpy not importable" }
          & $py validation\field_edge_make_cases.py 200 150
          if ($LASTEXITCODE) { throw "case generation failed" }
          foreach ($s in 'A','B') {
            $seed = if ($s -eq 'B') { 67890 } else { 12345 }
            @("Num_Threads 3", "Num_Primaries $env:PRIMARIES", "RNG_Seed $seed", "CT_File cube.mhd",
              "HU_Density_Conversion_File Scanners/default/HU_Density_Conversion.txt",
              "HU_Material_Conversion_File Scanners/default/HU_Material_Conversion.txt",
              "BDL_Machine_Parameter_File BDL/BDL_default_DN_RangeShifter.txt",
              "BDL_Plan_File E200_S150.txt", "Output_Directory out_E200_S150_after_$s", "Dose_MHD_Output True") |
              Set-Content -Encoding Ascii "cfg_$s.txt"
            New-Item -ItemType Directory -Force "out_E200_S150_after_$s" | Out-Null
            $t = Get-Date
            & .\MCsquare_win_portable.exe "cfg_$s.txt" *> "log_$s.txt"
            $rc = $LASTEXITCODE
            "RUN windows_$s seed=$seed rc=$rc wall_s=$([int]((Get-Date) - $t).TotalSeconds)"
            if ($rc -ne 0 -or -not (Test-Path "out_E200_S150_after_$s\Dose.raw")) { Get-Content "log_$s.txt" -Tail 20; throw "run $s failed" }
          }
          "=== WINDOWS profile"
          & $py validation\field_edge_profile.py "$PWD" E200_S150 after
          if ($LASTEXITCODE) { throw "profile failed" }
