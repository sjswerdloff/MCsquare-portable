# Windows x86-64 build of portable MCsquare with MinGW-w64 GCC (MSYS2 UCRT64), on the native Windows
# runners (label `windows`: the HP and the Lenovo, SYSTEM, capacity 1 each).
# MSYS2 is unpacked once per box into C:\mcsq-win\msys64 from a PINNED, SHA-256-verified dated release
# (the digest GitHub publishes for the msys2-installer release matched the repo.msys2.org file).
# An existing tree is trusted only if the installer it came from has that digest; otherwise it is
# wiped and reinstalled. pacman verifies package signatures itself.
# The .exe links libgomp dynamically (MSYS2 has no static libgomp); the smoke test runs it from
# PowerShell with only ucrt64\bin added to PATH.

name: CI Windows

on:
  push:
    branches: [main, connor/windows-portable]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    name: Build & smoke test (Windows x86-64, MinGW-w64 GCC)
    runs-on: windows
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: MSYS2 + UCRT64 GCC (verified, once per box)
        shell: powershell
        run: |
          & .\.gitea\scripts\ensure-msys2.ps1

      - name: Build MCsquare_win_portable.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'  # native stderr is not an error; results are checked explicitly
          $m = 'C:\mcsq-win\msys64'
          $env:MSYSTEM = 'UCRT64'; $env:CHERE_INVOKING = '1'
          & "$m\usr\bin\bash.exe" -lc 'gcc --version | head -1; make MCsquare_win_portable' 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE) { throw "build failed" }
          if (-not (Test-Path MCsquare_win_portable.exe)) { throw "no exe" }
          "DLLs the exe imports:"
          & "$m\usr\bin\bash.exe" -lc 'objdump -p MCsquare_win_portable.exe | grep "DLL Name"' 2>&1 | ForEach-Object { "$_" }

      - name: Smoke test (1000 primaries), run natively
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'  # native stderr is not an error; results are checked explicitly
          $env:PATH = "C:\mcsq-win\msys64\ucrt64\bin;$env:PATH"
          New-Item -ItemType Directory -Force smoke_test_output | Out-Null
          & .\MCsquare_win_portable.exe Sample_input_data\smoke_test_config.txt *> smoke.log
          $rc = $LASTEXITCODE
          Get-Content smoke.log -Tail 8
          if ($rc -ne 0) { throw "MCsquare exited $rc" }
          if (-not (Test-Path smoke_test_output\Dose.mhd)) { throw "no Dose.mhd" }
          Get-ChildItem smoke_test_output | ForEach-Object { "$($_.Length)`t$($_.Name)" }
          "Smoke test passed - Dose.mhd created"
