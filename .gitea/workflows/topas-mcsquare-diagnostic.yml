# PLANNING-DIAGNOSTIC runs for the portable MCsquare arm: the nuclear-off discriminator for the R80 gap (#32 comment
# 27679, estimand by alden-ec2221c7; authorised by sjswerdloff 2026-10-01, #32 comment 27702). NEVER in the main
# estimates and never an arm. Seeds 9400xx only; its own run root under diagnostic/. The TOPAS side (941xxx) is
# clement-7074f29f's and runs separately.
#
# Cells, H = 1e6, 4 runs each:  200 MeV nuclear ON 940001-4 · 200 MeV nuclear OFF 940011-4 · 70 MeV nuclear ON 940021-4.
# "Nuclear OFF" is the existing run-time switch Simulate_Nuclear_Interactions False (data_config.c:51): no code
# change. MCsquare does not echo parsed config (main.c leaves display_config commented out), but its parser warns
# "Unknown tag" for any key it does not recognise and exits on an invalid bool, so each run refuses on either. The
# switch's EFFECT is checked in the analysis (the far halo collapses with nuclear off), not here.
#
# BUILD and RUN are separate jobs (sjswerdloff), exactly as in topas-mcsquare-planning.yml.

name: TOPAS comparison, MCsquare nuclear-off diagnostic (portable, Studio)

# THIS FILE IS THE REQUEST. It runs on a push that changes this file.
on:
  push:
    branches: ['connor/topas-mcsquare-*']
    paths: [.gitea/workflows/topas-mcsquare-diagnostic.yml]

env:
  TARGET: arm64-mcpu-native
  EXTRA_CFLAGS: -mcpu=native
  # ENERGY:NUCLEAR:N:SEED. Empty = build only.
  RUNS: >-
    200:ON:1e6:940001 200:ON:1e6:940002 200:ON:1e6:940003 200:ON:1e6:940004
    200:OFF:1e6:940011 200:OFF:1e6:940012 200:OFF:1e6:940013 200:OFF:1e6:940014
    70:ON:1e6:940021 70:ON:1e6:940022 70:ON:1e6:940023 70:ON:1e6:940024
  STUDY_ROOT: /Volumes/T7 Shield/MonteCarlo_runs
  THREADS: "24"

jobs:
  build:
    name: Build (write-once)
    runs-on: stuart-m3ultra-canary
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build into builds/<commit>/<target>
        run: |
          set -euo pipefail
          B="$HOME/mcsq-builds/$GITHUB_SHA/$TARGET"
          if [ -e "$B/sha256.txt" ]; then echo "already built: $B"; cat "$B/build.txt" "$B/sha256.txt"; exit 0; fi
          if [ -e "$B" ]; then echo "$B exists without sha256.txt (interrupted build): refusing"; exit 1; fi
          make -B MCsquare_arm64 EXTRA_CFLAGS="$EXTRA_CFLAGS"
          mkdir -p "$(dirname "$B")"; mkdir "$B"   # no -p on the leaf: a concurrent builder fails here
          cp MCsquare_arm64 "$B/MCsquare"
          { echo "commit $GITHUB_SHA"; echo "host $(hostname)"; echo "cpu $(sysctl -n machdep.cpu.brand_string)";
            echo "compiler $(clang --version | head -1)"; echo "target MCsquare_arm64 EXTRA_CFLAGS=$EXTRA_CFLAGS"; } > "$B/build.txt"
          (cd "$B" && shasum -a 256 MCsquare > sha256.txt)
          chmod a-w "$B/MCsquare" "$B/build.txt" "$B/sha256.txt"
          cat "$B/build.txt" "$B/sha256.txt"

  diagnostic:
    name: Diagnostic runs (nuclear on/off, 200 and 70 MeV)
    needs: build
    runs-on: stuart-m3ultra-canary
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify binary, generate the cases, run, record
        run: |
          set -euo pipefail
          UV="$(command -v uv || true)"; [ -n "$UV" ] || UV="$HOME/.local/bin/uv"
          [ -x "$UV" ] || { echo "no uv on this runner"; exit 1; }
          if [ -z "$RUNS" ]; then echo "no runs requested (RUNS empty): nothing to do"; exit 0; fi
          B="$HOME/mcsq-builds/$GITHUB_SHA/$TARGET"
          (cd "$B" && shasum -a 256 -c sha256.txt)   # never compile here; the recorded binary or nothing
          cat "$B/build.txt"
          [ -d "$STUDY_ROOT" ] || { echo "$STUDY_ROOT not present (T7 not mounted?): refusing"; exit 1; }
          ROOT="$STUDY_ROOT/diagnostic/mcsquare-portable-$TARGET/$GITHUB_SHA/run${GITHUB_RUN_NUMBER}"
          FREE_GB=$(df -g "$STUDY_ROOT" | awk 'NR==2 {print $4}')
          [ "$FREE_GB" -ge 20 ] || { echo "only ${FREE_GB} GB free on the T7: refusing"; exit 1; }
          mkdir -p "$(dirname "$ROOT")"
          mkdir "$ROOT" || { echo "cannot create $ROOT (exists, or the T7 is not writable): refusing"; exit 1; }
          mkdir "$ROOT/snapshot"
          cp validation/mcsquare_pencil_case.py validation/pencil_endpoints.py Scanners/Water_Phantom/HU_*.txt "$ROOT/snapshot/"
          cp "$B/build.txt" "$ROOT/snapshot/build.txt"; cp "$B/sha256.txt" "$ROOT/snapshot/binary_sha256.txt"
          (cd "$ROOT/snapshot" && shasum -a 256 *.py *.txt > sha256.txt)
          cp -R Materials "$ROOT/snapshot/Materials"
          (cd "$ROOT/snapshot" && find Materials -type f -print0 | sort -z | xargs -0 shasum -a 256 > materials_sha256.txt)
          SNAP="$ROOT/snapshot"
          fail_run() { printf '{"seed": %s, "requested": "%s", "nuclear": "%s", "transport_status": "%s"}\n' "$SEED" "$N" "$NUC" "$1" > "$D/run.json"; echo "$1: refusing"; exit 1; }
          for spec in $RUNS; do
            IFS=: read -r ENERGY NUC N SEED <<< "$spec"
            case "$SEED" in 9400[0-9][0-9]) ;; *) echo "diagnostic seeds are 9400xx only: $spec"; exit 1;; esac
            case "$NUC" in ON) FLAG=True;; OFF) FLAG=False;; *) echo "nuclear must be ON or OFF: $spec"; exit 1;; esac
            CASE="$ROOT/case_E$ENERGY"
            if [ ! -d "$CASE" ]; then
              mkdir "$CASE"
              (cd "$CASE" && "$UV" run --no-project --with numpy python "$SNAP/mcsquare_pencil_case.py" \
                "$ENERGY" --nx 400 --ny 350 --nz 400 --iso-y 350 --nozzle 1)
              (cd "$CASE" && shasum -a 256 water.raw water.mhd "bdl_E$ENERGY.txt" "plan_E$ENERGY.txt" > inputs_sha256.txt)
            fi
            D="$ROOT/E${ENERGY}_nuc${NUC}_N${N}_seed${SEED}"
            mkdir "$D" "$D/out"
            # Relative paths only: MCsquare's config parser splits on whitespace and the T7 path has a space (#40).
            printf '%s\n' "Num_Threads $THREADS" "Num_Primaries $N" "RNG_Seed $SEED" "CT_File ../case_E$ENERGY/water.mhd" \
              "HU_Density_Conversion_File ../snapshot/HU_Density_Conversion.txt" \
              "HU_Material_Conversion_File ../snapshot/HU_Material_Conversion.txt" \
              "BDL_Machine_Parameter_File ../case_E$ENERGY/bdl_E$ENERGY.txt" "BDL_Plan_File ../case_E$ENERGY/plan_E$ENERGY.txt" \
              "Simulate_Nuclear_Interactions $FLAG" \
              "Output_Directory out" "Dose_MHD_Output True" > "$D/config.txt"
            awk 'NF != 2 {bad=1; print "config line is not KEY VALUE: " $0} END {exit bad}' "$D/config.txt"
            start=$(date +%s); START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            (cd "$D" && MCsquare_Materials_Dir="$SNAP/Materials/" "$B/MCsquare" config.txt) > "$D/log.txt" 2>&1 || { tail -20 "$D/log.txt"; fail_run "mcsquare_exit_nonzero"; }
            WALL=$(( $(date +%s) - start ))
            if grep -q 'Unknown tag' "$D/log.txt"; then grep 'Unknown tag' "$D/log.txt"; fail_run "config_tag_not_recognised"; fi
            SIM=$(grep -o 'Nbr primaries simulated: [0-9]*' "$D/log.txt" | awk '{print $4}' || true)
            [ -n "$SIM" ] && [ "$SIM" -ge "$(printf '%.0f' "$N")" ] || fail_run "simulated_count_below_requested"
            if grep -q 'generated outside the geometry' "$D/log.txt"; then fail_run "primaries_outside_geometry"; fi
            (cd "$D/out" && shasum -a 256 Dose.raw Dose.mhd > sha256.txt)
            REQ=$(printf '%.0f' "$N")
            printf '{"seed": %s, "requested": %s, "simulated": %s, "overshoot": %s, "threads": %s, "energy_mev": %s, "nuclear": "%s", "binary_sha256": "%s", "start_utc": "%s", "end_utc": "%s", "wall_s": %s, "transport_status": "ok"}\n' \
              "$SEED" "$REQ" "$SIM" "$((SIM - REQ))" "$THREADS" "$ENERGY" "$NUC" "$(awk '{print $1}' "$B/sha256.txt")" "$START_UTC" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$WALL" > "$D/run.json"
            cat "$D/run.json"
            "$UV" run --no-project --with numpy --with scipy python "$SNAP/pencil_endpoints.py" \
              mcsquare "$D/out/Dose.mhd" --label "diag_portable_${TARGET}_E${ENERGY}_nuc${NUC}_N${N}_seed${SEED}" | tee "$D/endpoints.json"
          done
          echo "outputs: $ROOT"
