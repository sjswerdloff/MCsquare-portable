# GitLab CI for MCsquare - PCG random number generator (MKL-free portable build)
# Tests compilation with GCC and OpenMP on x86_64 Linux

stages:
  - build
  - test

variables:
  DEBIAN_FRONTEND: noninteractive

build-gcc-pcg:
  stage: build
  image: ubuntu:22.04

  before_script:
    # Install build dependencies (no MKL needed - using PCG for random numbers)
    - apt-get update
    - apt-get install -y build-essential
    - gcc --version

  script:
    # Compile MCsquare with GCC + OpenMP + PCG (no MKL dependency)
    - |
      gcc src/*.c \
        -fopenmp \
        -lgomp -lpthread -lm -ldl \
        -O3 -m64 \
        -DVERSION="\"GitLab CI build (mkl-to-pcg64)\"" \
        -o MCsquare_gcc

    # Verify binary was created
    - ls -la MCsquare_gcc

    # Show version
    - ./MCsquare_gcc || true  # MCsquare prints version then exits with usage

  artifacts:
    paths:
      - MCsquare_gcc
    expire_in: 1 week

smoke-test:
  stage: test
  image: ubuntu:22.04

  before_script:
    # Install runtime dependencies (no MKL needed)
    - apt-get update
    - apt-get install -y libgomp1

  script:
    # Create output directory and test config with reduced primaries
    - mkdir -p smoke_test_output
    - |
      cat > smoke_test_config.txt << 'EOF'
      Num_Threads         1
      Num_Primaries       1000
      CT_File             Sample_input_data/CT.mhd
      HU_Density_Conversion_File   Scanners/default/HU_Density_Conversion.txt
      HU_Material_Conversion_File  Scanners/default/HU_Material_Conversion.txt
      BDL_Machine_Parameter_File   BDL/BDL_default_DN_RangeShifter.txt
      BDL_Plan_File       Sample_input_data/PlanPencil.txt
      Output_Directory    smoke_test_output
      Dose_MHD_Output     True
      EOF

    # Run smoke test
    - echo "Running MCsquare smoke test with 1000 primaries..."
    - ./MCsquare_gcc smoke_test_config.txt

    # Verify dose output was created
    - echo "Checking for output files..."
    - ls -la smoke_test_output/
    - test -f smoke_test_output/Dose.mhd && echo "Smoke test passed - Dose.mhd created!"

  dependencies:
    - build-gcc-pcg
